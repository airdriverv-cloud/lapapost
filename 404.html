<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — ЛапаПост</title>
<style>
:root{--paper:#f6f1e8;--ink:#1f1b17;--muted:#6d6358;--line:#e3d8c7;--accent:#7a5230}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;padding:24px}
.box{width:min(560px,100%);border:1px solid var(--line);background:#fffdf8;padding:40px 36px}
.code{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);margin:0 0 16px}
h1{font-size:34px;font-weight:500;line-height:1.15;margin:0 0 14px}
p{color:var(--muted);margin:0 0 26px}
a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:11px 18px;
  font-family:system-ui,sans-serif;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <p class="code">Ошибка 404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка.</p>
  <a href="https://airdriverv-cloud.github.io/lapapost/">На главную</a>
</div>
</body>
</html>
